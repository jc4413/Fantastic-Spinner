<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Pro Spinner - Absolute Lock Edition</title>
    <style>
        :root { --primary: #8b5cf6; --bg: #0f172a; --panel: #1e293b; --text: #ffffff; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        .security-screen { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #lockout-screen { display: none; background: #000; color: var(--danger); text-align: center; z-index: 9999; }
        .lock-card { background: var(--panel); padding: 30px; border-radius: 24px; text-align: center; width: 100%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); }
        .pass-input { width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 2px solid #334155; background: #000; color: #fff; font-size: 28px; text-align: center; letter-spacing: 8px; box-sizing: border-box; }
        .secure-btn { width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .retry-btn { margin-top: 20px; background: transparent; border: 1px solid #334155; color: #64748b; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; animation: fadeIn 0.5s; }
        #ui-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        #wheel-container { position: relative; width: 320px; height: 320px; margin: 20px 0; }
        canvas#wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); z-index: 1; }
        #pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid #ff4757; z-index: 10; transform-origin: 50% 0%; transition: transform 0.05s ease-out; }
        #center-hub { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 55px; height: 55px; background: white; border-radius: 50%; border: 5px solid #334155; cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center; color: #1e293b; font-weight: 900; font-size: 11px; user-select: none; }

        .input-area { width: 100%; margin-top: 15px; text-align: center; }
        textarea { width: 100%; height: 110px; padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: var(--panel); color: var(--text); font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 20px; }
        #spin-btn { display: block; margin: 0 auto; width: 100%; max-width: 320px; padding: 20px; border-radius: 15px; border: none; background: var(--primary); color: white; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); }

        #win-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; align-items: center; justify-content: center; }
        .win-card { background: white; color: #1e293b; padding: 40px; border-radius: 30px; text-align: center; width: 85%; max-width: 340px; }
        #don-btn { margin-top: 20px; padding: 15px 25px; color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; display: none; width: 100%; }
        #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 2001; }
        #cd-panel { display: none; position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: var(--panel); padding: 25px; border-radius: 20px; border: 2px solid var(--primary); z-index: 5000; width: 85%; max-width: 320px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body onclick="initAudio()">

<div id="lockout-screen" class="security-screen">
    <h1 style="font-size: 50px; margin: 0;">LOCKED</h1>
    <h2 id="lock-timer" style="font-size: 70px; font-family: monospace; margin: 20px 0;">5:00</h2>
    <button class="retry-btn" onclick="attemptRetry()">RETRY CONNECTION</button>
</div>

<div id="entry-screen" class="security-screen">
    <div class="lock-card">
        <h2>System Access</h2>
        <input type="password" id="entry-pass" class="pass-input" placeholder="••••" maxlength="4" autofocus>
        <button class="secure-btn" onclick="checkEntryPass()">UNLOCK SYSTEM</button>
        <p id="entry-status" style="color:var(--danger); margin-top:15px; font-size:13px; font-weight: bold;"></p>
    </div>
</div>

<div id="console-pass-screen" class="security-screen" style="display:none;" onclick="this.style.display='none'">
    <div class="lock-card" onclick="event.stopPropagation()">
        <h2>Override Auth</h2>
        <input type="password" id="console-pass" class="pass-input" placeholder="••••" maxlength="4">
        <button class="secure-btn" onclick="checkConsolePass()">ACCESS CONSOLE</button>
        <p id="console-status" style="color:var(--danger); margin-top:10px; font-size:12px;"></p>
    </div>
</div>

<div id="main-app">
    <canvas id="confetti-canvas"></canvas>
    <div id="ui-wrapper">
        <div id="wheel-container">
            <div id="pointer"></div>
            <div id="center-hub" onclick="handleCenterTap()">SPIN</div>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>
        <div class="input-area">
            <textarea id="namesList" oninput="drawWheel()">Alex&#10;Jordan&#10;Taylor&#10;Casey&#10;Riley</textarea>
            <button id="spin-btn" onclick="spin()">SPIN THE WHEEL</button>
        </div>
    </div>
</div>

<div id="cd-panel">
    <h3 style="margin:0; color:var(--primary);">Override Logic</h3>
    <p style="font-size: 11px; margin: 5px 0;">Force 50/50: /John_50 /Mike_50</p>
    <input type="text" id="rigCmd" placeholder="/Name_Weight" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; background:#000; color:#fff;">
    <button onclick="applyAndClose()" style="width:100%; background:var(--primary); color:white; border:none; padding:12px; border-radius:8px; font-weight:bold;">APPLY COMMAND</button>
</div>

<div id="win-overlay" onclick="closeWinner()">
    <div class="win-card" onclick="event.stopPropagation()">
        <h1 id="winner-name" style="font-size: 42px; margin: 0;">---</h1>
        <p id="winner-msg" style="margin: 10px 0; font-weight: bold; color: #64748b;">HAS WON!</p>
        <button id="don-btn" onclick="startDoubleOrNothing()">DOUBLE OR NOTHING?</button>
    </div>
</div>

<script>
    const REAL_COOLDOWN = 1.5 * 60 * 1000; 
    const VISUAL_COOLDOWN = 5 * 60 * 1000; 
    let attempts = parseInt(localStorage.getItem('spin_attempts')) || 0;
    let audioCtx, segments = [], isSpinning = false, rotation = 0, lastTickIdx = -1;
    let activeCommand = "", isDonMode = false, originalNames = "";
    let tapCount = 0, tapTimer;

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const namesArea = document.getElementById('namesList');
    const confCanvas = document.getElementById('confetti-canvas');
    const confCtx = confCanvas.getContext('2d');

    function initAudio() { 
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume(); 
    }

    function checkLockout() {
        const expiry = localStorage.getItem('spin_lockout_expiry');
        if (expiry) {
            const realLeft = expiry - Date.now();
            if (realLeft > 0) {
                document.getElementById('lockout-screen').style.display = 'flex';
                const visualLeft = Math.max(0, VISUAL_COOLDOWN - (REAL_COOLDOWN - realLeft));
                const mins = Math.floor(visualLeft / 60000);
                const secs = Math.floor((visualLeft % 60000) / 1000);
                document.getElementById('lock-timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                setTimeout(checkLockout, 1000);
                return true;
            } else { resetSecurity(); }
        }
        return false;
    }

    function resetSecurity() { localStorage.removeItem('spin_lockout_expiry'); localStorage.setItem('spin_attempts', '0'); attempts = 0; document.getElementById('lockout-screen').style.display = 'none'; }
    function attemptRetry() { if (Date.now() >= localStorage.getItem('spin_lockout_expiry')) resetSecurity(); }
    function checkEntryPass() { if (document.getElementById('entry-pass').value === "2125") { document.getElementById('entry-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'flex'; drawWheel(); } else { failAttempt('entry-status'); } }

    function failAttempt(id) {
        attempts++;
        localStorage.setItem('spin_attempts', attempts);
        if (attempts >= 3) { localStorage.setItem('spin_lockout_expiry', Date.now() + REAL_COOLDOWN); checkLockout(); }
        else { document.getElementById(id).innerText = `ACCESS DENIED. ${3-attempts} LEFT.`; }
    }

    function drawWheel() {
        const names = namesArea.value.split('\n').filter(t => t.trim() !== "");
        segments = names.map((n, i) => ({ name: n.trim(), color: ["#8b5cf6", "#ec4899", "#f59e0b", "#10b981", "#3b82f6", "#ef4444", "#fb923c", "#2dd4bf"][i % 8] }));
        render();
    }

    function render() {
        if (!segments.length) return;
        const arc = (Math.PI * 2) / segments.length;
        ctx.clearRect(0, 0, 600, 600);
        segments.forEach((s, i) => {
            const angle = i * arc + rotation;
            ctx.beginPath(); ctx.fillStyle = s.color; ctx.moveTo(300, 300);
            ctx.arc(300, 300, 290, angle, angle + arc);
            ctx.lineTo(300, 300); ctx.fill();
            ctx.save(); ctx.translate(300, 300); ctx.rotate(angle + arc/2);
            ctx.textAlign = "right"; ctx.fillStyle = "white"; ctx.font = "bold 24px sans-serif";
            ctx.fillText(s.name, 270, 10); ctx.restore();
        });
    }

    function playTick() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        document.getElementById('pointer').style.transform = "translateX(-50%) rotate(-15deg)";
        setTimeout(() => document.getElementById('pointer').style.transform = "translateX(-50%) rotate(0deg)", 40);
    }

    function spin() {
        if (isSpinning || !segments.length) return;
        initAudio();
        isSpinning = true;
        let targetIdx = -1;

        // FIXED RIGGING LOGIC - EXCLUSIVE TO COMMAND NAMES
        if (activeCommand.startsWith('/')) {
            const rigPairs = activeCommand.split(' ').filter(p => p.startsWith('/') && p.includes('_'));
            let weightMap = [];
            
            rigPairs.forEach(pair => {
                const parts = pair.substring(1).split('_');
                const name = parts[0].toLowerCase();
                const weight = parseInt(parts[1]);
                const foundIdx = segments.findIndex(s => s.name.toLowerCase() === name);
                if (foundIdx !== -1 && !isNaN(weight)) {
                    for(let i=0; i<weight; i++) weightMap.push(foundIdx);
                }
            });

            if (weightMap.length > 0) {
                const roll = Math.floor(Math.random() * weightMap.length);
                targetIdx = weightMap[roll];
            }
        }

        if (targetIdx === -1) targetIdx = Math.floor(Math.random() * segments.length);
        const arc = (Math.PI * 2) / segments.length;
        const stopAngle = (Math.PI * 1.5) - (targetIdx * arc) - (arc / 2);
        const finalRot = rotation + (Math.PI * 2 * 7) + (stopAngle - (rotation % (Math.PI * 2)));
        
        const animate = () => {
            let diff = finalRot - rotation;
            if (diff < 0.001) { isSpinning = false; finalize(targetIdx); return; }
            rotation += diff * 0.05;
            let currentIdx = Math.floor(((Math.PI * 1.5) - (rotation % (Math.PI * 2)) + (Math.PI * 2)) % (Math.PI * 2) / arc);
            if (currentIdx !== lastTickIdx) { playTick(); lastTickIdx = currentIdx; }
            render();
            requestAnimationFrame(animate);
        };
        animate();
    }

    function finalize(idx) {
        const winner = segments[idx % segments.length];
        document.getElementById('winner-name').innerText = winner.name;
        document.getElementById('winner-name').style.color = winner.color;
        document.getElementById('don-btn').style.display = isDonMode ? 'none' : 'block';
        document.getElementById('don-btn').style.backgroundColor = winner.color;
        document.getElementById('win-overlay').style.display = 'flex';
        startConfetti(winner.color);
    }

    function startDoubleOrNothing() {
        originalNames = namesArea.value; isDonMode = true;
        namesArea.value = "DOUBLE\nNOTHING\nDOUBLE\nNOTHING";
        drawWheel(); document.getElementById('win-overlay').style.display = 'none';
        setTimeout(spin, 600);
    }

    function closeWinner() { document.getElementById('win-overlay').style.display = 'none'; if (isDonMode) { namesArea.value = originalNames; isDonMode = false; drawWheel(); } }
    function handleCenterTap() { tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(() => tapCount = 0, 500); if (tapCount >= 5) { document.getElementById('console-pass-screen').style.display = 'flex'; tapCount = 0; } else if (!isSpinning) spin(); }
    function checkConsolePass() { if (document.getElementById('console-pass').value === "2413") { document.getElementById('console-pass-screen').style.display = 'none'; document.getElementById('cd-panel').style.display = 'block'; } else { failAttempt('console-status'); } }
    function applyAndClose() { activeCommand = document.getElementById('rigCmd').value.trim(); document.getElementById('rigCmd').value = ""; document.getElementById('cd-panel').style.display = 'none'; }

    function startConfetti(color) {
        confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight;
        let p = [];
        for(let i=0; i<100; i++) p.push({x: Math.random()*confCanvas.width, y:-20, s: Math.random()*8+4, c: color, vY: Math.random()*5+2, vX: Math.random()*4-2, r: Math.random()*360});
        const anim = () => {
            if(!p.length) return;
            confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
            p.forEach((item, i) => {
                item.y += item.vY; item.x += item.vX; item.r += 5;
                confCtx.save(); confCtx.fillStyle = item.c; confCtx.translate(item.x, item.y);
                confCtx.rotate(item.r * Math.PI/180); confCtx.fillRect(-item.s/2, -item.s/2, item.s, item.s); confCtx.restore();
                if(item.y > confCanvas.height) p.splice(i, 1);
            });
            requestAnimationFrame(anim);
        };
        anim();
    }
    checkLockout();
    drawWheel();
</script>
</body>
</html>
